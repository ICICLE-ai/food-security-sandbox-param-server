[project]
name = "food-security-sandbox-param"
version = "1.0.0"
description = "Food Security Sandbox parameter server: coordinates collaborative training and aggregates weights."
requires-python = ">=3.12,<3.13"
# Versions match the image deployed from year5_dev before the ICICLE CI/CD migration.
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "numpy==2.0.2",
    "pydantic-settings==2.11.0",
    "pymongo==4.17.0",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
]

[tool.uv]
package = false
