# ICICLE CI/CD config (cicd-templates v2.2.1): https://github.com/ICICLE-ai/cicd-templates/wiki/Quick-start
# Food Security Sandbox - parameter server (training coordination)
# Schema 1: deploys to an existing pod whose ID differs from its image name.
schema-version: 1
# Image repository already approved for the pod: ghcr.io/icicle-ai/<service-name>.
service-name: food-security-sandbox-param
# Existing Tapis pod this service deploys to.
pod-name: fssparam
# Becomes the image tag (ghcr.io/icicle-ai/food-security-sandbox-param:<version>). Bump for every deployable build.
service-version: 1.0.0
project-name: food-security-sandbox
service-type: domain
runtime-type: python
runtime-version: "3.12.15"
include-dev-dependencies: false
build-apt-packages: []
runtime-apt-packages: []
